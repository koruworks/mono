body = """
## Signed Windows builds

- On Windows, the installer, uninstaller, and executables are now code-signed
  by **Koru Works, Inc.**
- Signed Windows builds now include the Windows app identity package for native
  Windows notifications.

## Unified Settings

Account management and app preferences now live together in a single
**Settings** tab — covering **Cloud**, **Devices**, **Profiles**, and
**Workspaces** under Account, alongside **Appearance**, **Editor**,
**Terminal**, **System**, **Shortcuts**, and **Agent runtimes**.

- Searching Settings filters preference cards and highlights matching text as
  you type; pressing **Esc** clears the search.
- The circular profile button in the top-left corner opens a profile menu with
  a **Help** flyout and **Open in new window** for other profiles.
- Document fonts live under **Editor** (with a link from App fonts),
  **Appearance** offers page-background colors directly, and **Terminal** no
  longer defaults to a separate input box.
- Under **Agent runtimes**, the **Yolo** permission level is marked in red and
  notes *Not recommended* underneath when selected.

## Desktop chrome, sidebar, and quick filter

- Desktop windows use a slimmer top bar, capped tab widths with vertical
  dividers, a rounded workspace frame, and an accent-color border on both the
  active workspace and the active app in the left rail.
- Window titles now read `profile | workspace` so multi-profile windows stand
  apart in Alt+Tab and the taskbar.
- Collapsing the sidebar hides the rail too; pressing **Alt+1–8** slides a
  floating explorer preview in from the left without resizing the document and
  closes it once you pick a destination.
- The sidebar quick filter now stays active per view when you switch between
  **Documents**, **Tasks**, and **Chats**, clearing only when you delete the
  text, press **Esc**, or switch workspaces.
- The window menu adds **System**, **Light**, and **Dark** theme choices
  alongside window pinning and zoom.

## Typography and per-theme text rendering

- Text rendering controls (hinting, anti-aliasing, gamma, cutoff, and physical
  offset) and caret colors can be tuned independently for light and dark
  themes, with live dropdown previews and an editable sample document.
- Document body text defaults to 14 px with refined heading weights and scroll
  speed options up to 16×. On Windows, UI and document text default to
  Segoe UI.

## Simpler first run

- Opening Koru for the first time presents a single **Welcome** setup card
  with your profile, your first workspace (name, color, and a row of ten
  emoji), and an optional Koru Cloud card — plus a compact sign-in view for
  returning accounts — instead of a multi-step wizard.
- New workspaces start with a single starter document (*What Koru means*), and
  creating another profile in Settings no longer renames your account.

## Automatic 30-day trash cleanup

- Trashed documents, rows in a document's bin, and deleted task-list notes are
  now removed automatically after 30 days in local-only and Koru Cloud
  workspaces.
- Peer-to-peer workspaces keep manual trash cleanup and are not emptied
  automatically.
- The **Trash** view displays when each item will be removed (*Removed in N
  days*, *Removed in 1 day*, or *Removed today*) in workspaces with automatic
  cleanup, and **Koru Cloud** storage notes that deleted documents count toward
  storage until they are removed after 30 days.
- Stored OCR text from deleted pictures is also cleaned up once a page no
  longer references the image.

## Koru Cloud and durable document deletion

- **Koru Cloud** keeps your cached account, storage, and sync details on screen
  while refreshing in the background instead of rebuilding the page from
  scratch each time you open it.
- A new **Sign out…** button on the Cloud page lets you sign out cleanly;
  nothing syncs while signed out, and signing back in later catches up.
- Cloud storage displays sizes in KB, MB, and GB instead of exact bytes.
- Permanently deleting a document is now durable across devices. If a document
  deleted on another device still has local changes here, you can choose to keep
  or delete it from the workspace menu.

## Inline Mermaid diagrams in AI chat

Fenced Mermaid code blocks in AI chat tabs and the AI side pane render inline
as diagrams while keeping readable source during streaming or on invalid
syntax. Copying or saving a reply preserves the original Markdown, and clicking
a rendered diagram opens it in the diagram viewer with zoom, pan, copy, and
save actions.

## Fixes

- Fixed a crash when scrolling documents containing copied or duplicated inline
  pills.
- Moving the pointer horizontally or diagonally from **Help** in the Profile
  menu into the **Help** flyout no longer closes the submenu on the way over.
- The **Trash** row is back at the foot of the navigator, **Delete permanently**
  works on individual Trash rows, and Trash tabs in split panes stay in sync.
- Typing immediately into a brand-new document keeps your first input without
  dropping characters.
- Welcome and Settings stay in Back/Forward navigation history, including
  scroll position.
- Creating a workspace on a newly provisioned Cloud profile no longer waits for
  identity sync to finish first, and newly signed-in devices select held
  Profiles up front so file sync starts right away.
- Deleting a hosted Profile re-authenticates with the sign-in provider your
  session actually used, with cancel and error recovery.
"""
