# **The package and the binary it ships are both `koru-read-worker`.**
#
# The contract crate is already called `koru-read` (`crates/koru-read`), and two
# packages cannot share a name in one workspace — the split `apps/koru-voice`
# already makes, for the same reason. `[[bin]]` pins the shipped file name.
# Keep it synchronized with `koru_update::exe::READ`, `koru-release`'s
# `CHANNEL_BINARIES` and macOS notices list, the Store's sibling resolution,
# the launchers and stop scripts, logs and docs. A partial rename makes the
# worker buildable but neither launchable nor safely replaceable.
[package]
rust-version.workspace = true
name = "koru-read-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The Koru read worker: handed a read-only path to one file, it returns the file's words page by page. Untrusted bytes are parsed here and nowhere else; it holds no Store session and makes no network call."

[[bin]]
name = "koru-read-worker"
path = "src/main.rs"

[lib]
name = "koru_read_worker"
path = "src/lib.rs"

[dependencies]
# The messages, the page caps and the reading tokens. This binary speaks them
# and redefines none of them.
koru-read = { path = "../../crates/koru-read" }
# The supervised-child mechanism the Store launches this through: the bounded
# bootstrap line on stdin, and the pipe behind it as the parent-death signal.
koru-agent-worker = { path = "../../crates/koru-agent-worker" }
# The endpoint, the framing and the blocking listener. The whole transport.
koru-ipc = { path = "../../crates/koru-ipc" }
# Which channel this build is and where its Store root is — `--root` overrides
# it, and both reach `Endpoint::for_service_root`.
koru-channel = { path = "../../crates/koru-channel" }
# `KORU_READ_IDLE_EXIT` is declared there, or it is invisible to `koru.bat envs`
# and to reference/ENV.md.
koru-env = { path = "../../crates/koru-env" }
# File logging under `<store root>/logs/`, daily rotation, the shared panic hook.
koru-log = { path = "../../crates/koru-log" }
# The PDF parser and interpreter. A page's glyphs arrive at `text::Collector`,
# which this crate writes; there is no "give me the text" call to lean on.
hayro-interpret = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The fixtures are PDFs written at test time, in memory (`src/fixtures.rs`),
# one of them encrypted with the standard security handler, which is MD5 and
# RC4. Already a workspace dependency (`koru-import-evernote`); nothing new.
md5 = { workspace = true }
