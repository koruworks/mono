# A stable release on GitHub: one release per `v<version>` tag of this
# repository, built when the maintainer pushes that tag.
#
#   releases/<version>.toml committed
#   git tag v<version> && git push origin v<version>
#
# The design is docs/features/github-release/STABLE.md. Linux, Windows and
# macOS are built by release-build.yml, the builds the nightly makes too, with
# what the stable on the update origin always carried baked in (S8): Koru
# Cloud, Google Docs import, the support and feedback links.
#
# It is nightly.yml's shape with three differences, the first two because a
# `v*` tag never moves (the repository ruleset lets only the maintainer
# create one, and nobody move or delete it):
#
# - **The tag is the version.** Nothing is inferred; the notes are the
#   version's own descriptor, `releases/<version>.toml`, at the tagged commit.
# - **A release is added to, never replaced.** A build that fails is re-run
#   from the Actions page ("Re-run failed jobs"), not re-tagged. A re-run keeps
#   the plan job's build number, and uploads over its own files.
# - **All or nothing** (S7). The release is published only when every
#   platform built. Marked latest without one platform's feed, it would answer
#   that platform's installs with a 404; the nightly's "whatever built" is the
#   opposite on purpose.
#
# Installed stable builds read `releases/latest/download/`, which GitHub
# resolves to the release marked latest; the publish job marks this one only
# when its version is the highest stable published, so a patch to an older
# line cannot take the feed over.
name: stable

on:
  push:
    # A stable version only; a `v0.2.0-beta.1` does not match.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

# One publish of a version at a time, and never cancelled halfway: a publish
# interrupted between its package and its feed would leave a feed naming an
# older file, or none.
concurrency:
  group: koru-stable-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The version from the tag, and one reading of the clock for every
  # platform's build number, as the nightly's (N11): the UTC minute, so a
  # stable build and a nightly compare correctly whichever is newer.
  plan:
    name: plan
    if: github.repository == 'koruworks/mono'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - id: plan
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "$TAG is not a stable version tag" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

  # One call of the shared build per platform (S6). The download base is this
  # tag's own release; the update base follows the latest release instead.
  build-linux:
    name: build-linux
    needs: plan
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml
    secrets: inherit
    with:
      platform: linux
      channel: stable
      version: ${{ needs.plan.outputs.version }}
      build: ${{ needs.plan.outputs.build }}
      download-base: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
      update-base: https://github.com/${{ github.repository }}/releases/latest/download
      with-cloud: true

  build-windows:
    name: build-windows
    needs: plan
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml
    secrets: inherit
    with:
      platform: windows
      channel: stable
      version: ${{ needs.plan.outputs.version }}
      build: ${{ needs.plan.outputs.build }}
      download-base: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
      update-base: https://github.com/${{ github.repository }}/releases/latest/download
      with-cloud: true

  # Always signed for stable: without the Developer ID material the job
  # fails, rather than building the nightly's unpublished disk image.
  build-macos:
    name: build-macos
    needs: plan
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml
    secrets: inherit
    with:
      platform: macos
      channel: stable
      version: ${{ needs.plan.outputs.version }}
      build: ${{ needs.plan.outputs.build }}
      download-base: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
      update-base: https://github.com/${{ github.repository }}/releases/latest/download
      with-cloud: true

  # Runs only when every build succeeded (S7): `needs` without an `if` is
  # exactly that.
  publish:
    name: publish
    needs: [plan, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # One directory per platform, named after its artifact.
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: stable-*
          path: stable
      # **Packages before feeds**, as the nightly's publish: the manifest an
      # installed app reads never names a file that is not there yet. The
      # release is created unmarked, so `releases/latest/` does not move to it
      # before its feeds are uploaded.
      - name: Publish the release
        working-directory: stable
        run: |
          set -euo pipefail
          shopt -s nullglob
          builds=(*/)
          test "${#builds[@]}" -eq 3 || { echo "::error::expected three platforms, found ${#builds[@]}"; exit 1; }
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --latest=false \
              --title "Koru $VERSION" --notes-file "${builds[0]}release-body.md"
          fi
          packages=() feeds=()
          for build in "${builds[@]}"; do
            feed=("$build"stable-*.json)
            test "${#feed[@]}" -eq 1
            feeds+=("${feed[0]}")
            for file in "$build"*; do
              case "$(basename "$file")" in
                stable-*.json | release-body.md) ;;
                *) packages+=("$file") ;;
              esac
            done
          done
          gh release upload "$TAG" "${packages[@]}" --clobber
          gh release upload "$TAG" "${feeds[@]}" --clobber
      # **Latest only when it is the newest stable**, by version rather than
      # by date: GitHub's own choice would hand the feed to whichever release
      # was created last.
      - name: Mark it latest if it is the newest stable
        run: |
          set -euo pipefail
          newest="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 \
            --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1)"
          if [ "$newest" = "$VERSION" ]; then
            gh release edit "$TAG" --latest
            echo "$TAG is the latest stable release"
          else
            echo "$TAG is not marked latest: $newest is newer"
          fi
