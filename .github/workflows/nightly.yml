# The rolling nightly: one pre-release on the `nightly` tag of this repository,
# rebuilt and replaced every time the maintainer moves that tag.
#
#   ./koru.sh nightly-notes            # draft releases/nightly/<date>.toml
#   git add releases/nightly && git commit
#   git tag -f nightly && git push -f origin nightly
#
# The design is docs/features/linux/NIGHTLY.rev2.md (and the 2026-10-24
# amendment at the top of docs/features/github-release/TECHNICAL.final.md).
# One build per platform, each a call of release-build.yml (the builds
# stable.yml makes too), all feeding one publish job. macOS builds every time
# but is published only when it is Developer ID signed and notarized
# (NIGHTLY rev2 §6); until then its disk image is a workflow artifact.
#
# The rules differ from ci.yml's on purpose, and only here: this workflow
# signs and publishes, so its secrets live in the `nightly` environment, which
# only the `nightly` tag can deploy to, and one job has a write token. A tag
# push is its only trigger — no schedule, no Run workflow button — and the
# repository ruleset lets only the maintainer move that tag. Every third-party
# action is pinned to a full commit SHA, the tag in the comment above it.
#
# **A platform that fails keeps its last nightly.** Each platform that built
# is published whether or not the others did, and only its own files are
# replaced, so an installed Koru never loses its feed to another platform's
# broken build (rev2 §3).
name: nightly

on:
  push:
    tags: [nightly]

permissions:
  contents: read

# One nightly at a time, and never cancelled halfway: a publish interrupted
# between its upload and its delete would leave the page half-replaced. A
# second tag push while one runs waits; a third replaces the second.
concurrency:
  group: koru-nightly
  cancel-in-progress: false

jobs:
  # **One reading of the clock for every platform** (N11): the build number is
  # the UTC minute, and two platforms of one nightly must carry the same one.
  plan:
    name: plan
    if: github.repository == 'koruworks/mono'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.clock.outputs.build }}
    steps:
      - id: clock
        run: echo "build=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

  # One call of the shared build per platform (STABLE S6), so each platform's
  # result is its own and the publish below can tell them apart.
  build-linux:
    name: build-linux
    needs: plan
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml
    secrets: inherit
    with:
      platform: linux
      channel: nightly
      build: ${{ needs.plan.outputs.build }}
      download-base: https://github.com/${{ github.repository }}/releases/download/nightly

  build-windows:
    name: build-windows
    needs: plan
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml
    secrets: inherit
    with:
      platform: windows
      channel: nightly
      build: ${{ needs.plan.outputs.build }}
      download-base: https://github.com/${{ github.repository }}/releases/download/nightly

  # macOS builds every nightly; it is published once it is signed (rev2 §6,
  # N20), which the call's `signed` output says.
  build-macos:
    name: build-macos
    needs: plan
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml
    secrets: inherit
    with:
      platform: macos
      channel: nightly
      build: ${{ needs.plan.outputs.build }}
      download-base: https://github.com/${{ github.repository }}/releases/download/nightly

  publish:
    name: publish
    needs: [build-linux, build-windows, build-macos]
    # Whatever built is published (rev2 §3); only a nightly where nothing
    # built, or one that was cancelled, publishes nothing. An unsigned macOS
    # build is not a published platform: it neither counts here nor is said
    # to have failed on the page.
    if: >-
      !cancelled() &&
      (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' ||
       (needs.build-macos.result == 'success' && needs.build-macos.outputs.signed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULTS: >-
        linux-x86_64=${{ needs.build-linux.result }}
        windows-x86_64=${{ needs.build-windows.result }}
        ${{ needs.build-macos.outputs.signed == 'true' && format('macos-aarch64={0}', needs.build-macos.result) || '' }}
    steps:
      # One directory per platform that built, named after its artifact.
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: nightly-*
          path: nightly
      # **The order is the point.** Upload every new package first, then point
      # the feeds at them, then delete the packages they replaced — so the
      # manifest an installed app reads never names a file that is not there.
      # Only a platform that built has anything deleted; another platform's
      # files stay as its last nightly left them.
      - name: Replace the built platforms' files
        working-directory: nightly
        run: |
          set -euo pipefail
          shopt -s nullglob
          # download-artifact unpacks a lone artifact straight into `path`,
          # not into a directory named after it, so a nightly where only one
          # platform built lands flat: give it its directory back.
          flat=(nightly-*.json)
          if [ "${#flat[@]}" -eq 1 ]; then
            dir="${flat[0]%.json}"
            mkdir "$dir"
            find . -maxdepth 1 -type f -exec mv -t "$dir" {} +
          fi
          builds=(*/)
          test "${#builds[@]}" -ge 1
          # Every build writes the same body; a platform that did not build
          # this time is said so below it.
          cp "${builds[0]}release-body.md" release-body.md
          for result in $RESULTS; do
            if [ "${result#*=}" != success ]; then
              printf '\n_The %s build of this nightly did not complete; its download and update feed are from an earlier nightly, if there is one._\n' \
                "${result%%=*}" >> release-body.md
            fi
          done
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --verify-tag --prerelease \
              --title "Koru nightly" --notes-file release-body.md
          fi
          old="$(gh release view nightly --json assets --jq '.assets[].name')"
          packages=() feeds=() targets=()
          for build in "${builds[@]}"; do
            feed=("$build"nightly-*.json)
            test "${#feed[@]}" -eq 1
            feeds+=("${feed[0]}")
            name="$(basename "${feed[0]}" .json)"
            targets+=("${name#nightly-}")
            for file in "$build"*; do
              case "$(basename "$file")" in
                nightly-*.json | release-body.md) ;;
                *) packages+=("$file") ;;
              esac
            done
          done
          gh release upload nightly "${packages[@]}" --clobber
          gh release upload nightly "${feeds[@]}" --clobber
          keep=" "
          for file in "${packages[@]}" "${feeds[@]}"; do keep+="$(basename "$file") "; done
          for name in $old; do
            case "$keep" in *" $name "*) continue ;; esac
            for target in "${targets[@]}"; do
              case "$name" in
                koru-*-"$target".* | koru-*-"$target"-setup.*) gh release delete-asset nightly "$name" --yes ;;
              esac
            done
          done
          gh release edit nightly --prerelease --title "Koru nightly" --notes-file release-body.md
