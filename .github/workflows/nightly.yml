# The rolling nightly: one pre-release on the `nightly` tag of this repository,
# rebuilt and replaced every time the maintainer moves that tag.
#
#   ./koru.sh nightly-notes            # draft releases/nightly/<date>.toml
#   git add releases/nightly && git commit
#   git tag -f nightly && git push -f origin nightly
#
# The design is docs/features/linux/NIGHTLY.rev2.md (and the 2026-10-24
# amendment at the top of docs/features/github-release/TECHNICAL.final.md).
# One build job per platform, all feeding one publish job. macOS builds every
# time but is published only when it is Developer ID signed and notarized
# (NIGHTLY rev2 §6); until then its disk image is a workflow artifact.
#
# The rules differ from ci.yml's on purpose, and only here: this workflow
# signs and publishes, so its secrets live in the `nightly` environment, which
# only the `nightly` tag can deploy to, and one job has a write token. A tag
# push is its only trigger — no schedule, no Run workflow button — and the
# repository ruleset lets only the maintainer move that tag. Every third-party
# action is pinned to a full commit SHA, the tag in the comment above it.
#
# **A platform that fails keeps its last nightly.** Each platform that built
# is published whether or not the others did, and only its own files are
# replaced, so an installed Koru never loses its feed to another platform's
# broken build (rev2 §3).
name: nightly

on:
  push:
    tags: [nightly]

permissions:
  contents: read

# One nightly at a time, and never cancelled halfway: a publish interrupted
# between its upload and its delete would leave the page half-replaced. A
# second tag push while one runs waits; a third replaces the second.
concurrency:
  group: koru-nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # **One reading of the clock for every platform** (N11): the build number is
  # the UTC minute, and two platforms of one nightly must carry the same one.
  plan:
    name: plan
    if: github.repository == 'koruworks/mono'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.clock.outputs.build }}
    steps:
      - id: clock
        run: echo "build=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

  build-linux:
    name: build (linux-x86_64)
    needs: plan
    # The oldest LTS hosted image, for the glibc baseline (release design D20).
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    environment: nightly
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
          # The notes step diffs the tag's previous commit against this one.
          fetch-depth: 0
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig-dev libssl-dev
      - name: Fetch third-party code
        run: bash scripts/setup/fetch-third-party.sh
      # mozilla-actions/sccache-action v0.0.11
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      # actions/cache v6.1.0
      - id: fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: assets/fonts/
          key: fonts-${{ hashFiles('scripts/setup/fonts.manifest', 'scripts/setup/fetch-fonts.sh') }}
      - name: Fetch fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        run: bash scripts/setup/fetch-fonts.sh
      # **No notes, no nightly.** Exactly one releases/nightly/*.toml must have
      # been added since the tag's previous position; it fails before anything
      # is built otherwise. An all-zero `before` is the tag's first push.
      - name: Select this nightly's notes
        id: notes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          path="$(./koru.sh release-tool nightly-notes --select "$BEFORE" "$AFTER" | tail -n 1)"
          test -f "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Build, sign and write the release files
        env:
          NIGHTLY_MINISIGN_KEY: ${{ secrets.NIGHTLY_MINISIGN_KEY }}
          NIGHTLY_MINISIGN_PASSWORD: ${{ secrets.NIGHTLY_MINISIGN_PASSWORD }}
          NOTES: ${{ steps.notes.outputs.path }}
          BUILD: ${{ needs.plan.outputs.build }}
        run: |
          key="$RUNNER_TEMP/minisign.key"
          (umask 077 && printf '%s\n' "$NIGHTLY_MINISIGN_KEY" > "$key")
          printf '%s' "$NIGHTLY_MINISIGN_PASSWORD" | ./koru.sh release-tool dist-github nightly \
            --build "$BUILD" \
            --notes "$NOTES" \
            --key "$key" --key-password-stdin \
            --download-base "https://github.com/${{ github.repository }}/releases/download/nightly" \
            --out dist/nightly
          rm -f "$key"
      # CI cannot open a window; this catches a missing library or a crash at
      # load, as ci.yml's Windows packaging smoke does.
      - name: Smoke-test the packaged binaries
        run: |
          archives=(dist/nightly/*.tar.gz)
          test "${#archives[@]}" -eq 1
          smoke="$RUNNER_TEMP/koru-package"
          mkdir -p "$smoke"
          tar -xzf "${archives[0]}" -C "$smoke"
          timeout 30 "$smoke/koru" --help >/dev/null
          timeout 30 "$smoke/koru-agent" --help >/dev/null
      # actions/attest-build-provenance v4.2.2
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/nightly/*.tar.gz
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nightly-linux-x86_64
          path: dist/nightly/
          retention-days: 7
          if-no-files-found: error

  build-windows:
    name: build (windows-x86_64)
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 150
    environment: nightly
    permissions:
      contents: read
      # Azure sign-in for Authenticode, and the provenance attestation.
      id-token: write
      attestations: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      SHERPA_ONNX_ARCHIVE_DIR: ${{ github.workspace }}\third-party\sherpa-onnx\1.13.6
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0
      # The setup is ci.yml's Windows test job's: patched crates, the pinned
      # sherpa-onnx archive the voice runtime links, the bundled fonts.
      - name: Fetch third-party code
        shell: pwsh
        run: ./scripts/setup/fetch-third-party.ps1
      # mozilla-actions/sccache-action v0.0.11
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      # actions/cache v6.1.0
      - id: sherpa
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: third-party/sherpa-onnx/1.13.6
          key: sherpa-no-tts-${{ runner.os }}-${{ hashFiles('scripts/setup/fetch-voice-runtime.ps1') }}
      - name: Fetch the sherpa-onnx archive
        shell: pwsh
        run: ./scripts/setup/fetch-voice-runtime.ps1
      # actions/cache v6.1.0
      - id: fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: assets/fonts/
          key: fonts-${{ hashFiles('scripts/setup/fonts.manifest', 'scripts/setup/fetch-fonts.ps1') }}
      - name: Fetch fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/setup/fetch-fonts.ps1
      # (see build-linux)
      - name: Select this nightly's notes
        id: notes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          path="$(cargo run --locked -q -p koru-release -- nightly-notes --select "$BEFORE" "$AFTER" | tail -n 1)"
          test -f "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      # **Authenticode, through Azure Artifact Signing** (release design D9).
      # Off until the certificate profile exists — the organization's identity
      # validation decides when — and then on with no change here: setting
      # ARTIFACT_SIGNING_PROFILE and WINDOWS_PACKAGE_PUBLISHER in the
      # environment is the switch. No key or password is stored: the job signs
      # in to Azure with its OIDC token, as the app registration the
      # environment's federated credential names, and Microsoft's HSM signs.
      # azure/login v3.1.0
      - name: Sign in to Azure
        if: vars.ARTIFACT_SIGNING_PROFILE != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # signtool from the image's newest Windows SDK, with Microsoft's signing
      # client as its digest library — the client pinned by version and hash,
      # as fetch-voice-runtime.ps1 pins sherpa-onnx. `koru-release` signs every
      # executable and the notification-identity MSIX through
      # KORU_SIGNTOOL_COMMAND, and builds that MSIX because the publisher is set.
      - name: Prepare Authenticode signing
        if: vars.ARTIFACT_SIGNING_PROFILE != ''
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          PUBLISHER: ${{ vars.WINDOWS_PACKAGE_PUBLISHER }}
          CLIENT_VERSION: 1.0.146
          CLIENT_SHA256: 7761e5d8f31e54b764da21d33cd8b0a2940e1b05526c7dfcb5e94b0431426f70
        run: |
          if (-not $env:PUBLISHER) {
            throw 'WINDOWS_PACKAGE_PUBLISHER must be set with ARTIFACT_SIGNING_PROFILE: it is the certificate subject the MSIX names'
          }
          $tools = Join-Path $env:RUNNER_TEMP 'artifact-signing'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $client = Join-Path $tools 'client.zip'
          Invoke-WebRequest -OutFile $client -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$env:CLIENT_VERSION/microsoft.artifactsigning.client.$env:CLIENT_VERSION.nupkg"
          if ((Get-FileHash -Algorithm SHA256 $client).Hash -ne $env:CLIENT_SHA256) {
            throw "Microsoft.ArtifactSigning.Client $env:CLIENT_VERSION does not match its pinned hash"
          }
          Expand-Archive $client -DestinationPath (Join-Path $tools 'client')
          $dlib = Join-Path $tools 'client\bin\x64\Azure.CodeSigning.Dlib.dll'
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Where-Object { $_.Directory.Parent.Name -as [version] } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool -or [version]$signtool.Directory.Parent.Name -lt [version]'10.0.22621.0') {
            throw 'Artifact Signing needs signtool from Windows SDK 10.0.22621 or later'
          }
          # The Azure CLI sign-in above is the credential; the others would
          # only be probed first, and the managed-identity probe is slow here.
          $metadata = Join-Path $tools 'metadata.json'
          @{
            Endpoint = $env:ENDPOINT
            CodeSigningAccountName = $env:ACCOUNT
            CertificateProfileName = $env:PROFILE
            ExcludeCredentials = @(
              'EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content -Encoding utf8 $metadata
          "KORU_SIGNTOOL_COMMAND=`"$($signtool.FullName)`" sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib `"$dlib`" /dmdf `"$metadata`" {file}" >> $env:GITHUB_ENV
          "KORU_WINDOWS_PACKAGE_PUBLISHER=$env:PUBLISHER" >> $env:GITHUB_ENV
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
      # **The installer is NSIS** (rev2 §12, N18). `windows-latest` stopped
      # carrying it (the run of 2026-10-30 found none), so a missing one is
      # installed from Chocolatey at a pinned version, never whatever is
      # newest. `!uninstfinalize`, which signs the uninstaller, needs 3.08 or
      # later.
      - name: Find NSIS
        shell: pwsh
        env:
          NSIS_VERSION: 3.13.0
        run: |
          $default = 'C:\Program Files (x86)\NSIS\makensis.exe'
          $find = {
            if (Test-Path $default) { $default }
            else { (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source }
          }
          $makensis = & $find
          if (-not $makensis) {
            choco install nsis --version $env:NSIS_VERSION --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco could not install NSIS $env:NSIS_VERSION" }
            $makensis = & $find
          }
          if (-not $makensis) { throw 'NSIS is not on this image and did not install: the Windows installer needs makensis 3.08 or later' }
          $version = (& $makensis /VERSION).Trim()
          if ([version]($version.TrimStart('v') -replace '[^0-9.].*$', '') -lt [version]'3.8') {
            throw "NSIS $version is older than 3.08"
          }
          "NSIS $version at $makensis"
          "MAKENSIS=$makensis" >> $env:GITHUB_ENV
      - name: Build, sign and write the release files
        shell: bash
        env:
          NIGHTLY_MINISIGN_KEY: ${{ secrets.NIGHTLY_MINISIGN_KEY }}
          NIGHTLY_MINISIGN_PASSWORD: ${{ secrets.NIGHTLY_MINISIGN_PASSWORD }}
          NOTES: ${{ steps.notes.outputs.path }}
          BUILD: ${{ needs.plan.outputs.build }}
        run: |
          key="$RUNNER_TEMP/minisign.key"
          (umask 077 && printf '%s\n' "$NIGHTLY_MINISIGN_KEY" > "$key")
          printf '%s' "$NIGHTLY_MINISIGN_PASSWORD" | cargo run --locked -q -p koru-release -- dist-github nightly \
            --build "$BUILD" \
            --notes "$NOTES" \
            --key "$key" --key-password-stdin \
            --download-base "https://github.com/${{ github.repository }}/releases/download/nightly" \
            --out dist/nightly
          rm -f "$key"
      # (see build-linux) And, once signing is on, that it signed everything:
      # an executable without a valid signature is the SmartScreen warning
      # back, and a missing MSIX is reminders that silently never show.
      - name: Smoke-test the packaged binaries
        shell: pwsh
        env:
          SIGNED: ${{ vars.ARTIFACT_SIGNING_PROFILE != '' }}
        run: |
          $archives = @(Get-ChildItem dist/nightly -Filter *.zip)
          if ($archives.Count -ne 1) { throw 'Expected exactly one release archive' }
          $package = Join-Path $env:RUNNER_TEMP 'koru-package'
          Expand-Archive $archives[0].FullName -DestinationPath $package
          foreach ($name in 'koru.exe', 'koru-agent.exe') {
            $exe = @(Get-ChildItem $package -Recurse -Filter $name)
            if ($exe.Count -ne 1) { throw "Expected exactly one packaged $name" }
            $process = Start-Process -FilePath $exe[0].FullName -ArgumentList '--help' -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(30000)) {
              $process.Kill()
              throw "Packaged $name did not finish --help within 30 seconds"
            }
            if ($process.ExitCode -ne 0) { throw "Packaged $name exited with $($process.ExitCode)" }
          }
          if ($env:SIGNED -eq 'true') {
            $unsigned = @(Get-ChildItem $package -Recurse -Filter *.exe |
              Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' })
            if ($unsigned) { throw "Not validly signed: $($unsigned.Name -join ', ')" }
            $identity = @(Get-ChildItem $package -Recurse -Filter koru-identity.msix)
            if ($identity.Count -ne 1) { throw 'A signed build without its notification identity package' }
            & $env:SIGNTOOL verify /pa $identity[0].FullName
            if ($LASTEXITCODE -ne 0) { throw 'koru-identity.msix is not validly signed' }
          }
      # **The installer installs, runs and uninstalls cleanly** — silently,
      # into a directory of its own: the shortcuts and the Settings -> Apps
      # entry appear, `--help` runs from the installed copy, and uninstalling
      # takes all three away again. Signed, setup.exe and the uninstaller it
      # wrote are checked too.
      - name: Install, run and uninstall
        shell: pwsh
        env:
          SIGNED: ${{ vars.ARTIFACT_SIGNING_PROFILE != '' }}
        run: |
          $setup = @(Get-ChildItem dist/nightly -Filter *-setup.exe)
          if ($setup.Count -ne 1) { throw 'Expected exactly one installer' }
          $dir = Join-Path $env:RUNNER_TEMP 'koru-installed'
          $product = 'Koru Nightly'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) "$product.lnk"
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Koru.Desktop.Nightly'
          $process = Start-Process -FilePath $setup[0].FullName -ArgumentList '/S', "/D=$dir" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "setup.exe exited with $($process.ExitCode)" }
          $koru = Join-Path $dir 'koru.exe'
          $uninstaller = Join-Path $dir "Uninstall $product.exe"
          foreach ($path in $koru, $uninstaller, $shortcut) {
            if (-not (Test-Path $path)) { throw "Not installed: $path" }
          }
          if ((Get-ItemProperty $key).DisplayName -ne $product) { throw 'No Settings -> Apps entry' }
          $process = Start-Process -FilePath $koru -ArgumentList '--help' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'The installed koru.exe did not finish --help within 30 seconds'
          }
          if ($process.ExitCode -ne 0) { throw "The installed koru.exe exited with $($process.ExitCode)" }
          if ($env:SIGNED -eq 'true') {
            foreach ($path in $setup[0].FullName, $uninstaller) {
              if ((Get-AuthenticodeSignature $path).Status -ne 'Valid') { throw "Not validly signed: $path" }
            }
          }
          # The uninstaller copies itself out of the directory and returns at
          # once, so what it did is waited for, not its process.
          Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $dir) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          foreach ($path in $dir, $shortcut, $key) {
            if (Test-Path $path) { throw "Left behind by the uninstaller: $path" }
          }
      # actions/attest-build-provenance v4.2.2
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/nightly/*.zip
            dist/nightly/*-setup.exe
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nightly-windows-x86_64
          path: dist/nightly/
          retention-days: 7
          if-no-files-found: error

  # **macOS builds every nightly; it is published once it is signed** (rev2
  # §6, N20). Until the `nightly` environment holds a Developer ID
  # certificate and the notary key, the job builds
  # an ad-hoc-signed disk image the way `./koru.sh dist-local` does on a Mac
  # and keeps it as a workflow artifact for testing — not named `nightly-*`,
  # so the publish job never sees it. With the material present, the same job
  # signs, notarizes, staples and publishes. The switch is the vault and
  # `github_environment.py --apply`, as Windows's is, never this file.
  build-macos:
    name: build (macos-aarch64)
    needs: plan
    runs-on: macos-15
    timeout-minutes: 150
    environment: nightly
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      SHERPA_ONNX_ARCHIVE_DIR: ${{ github.workspace }}/third-party/sherpa-onnx/1.13.6
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0
      # **All of it, or an unpublished build.** Half the material is a
      # misconfiguration, said as one. The `.p12`'s password alone may be
      # absent: a `.p12` exported with none is opened with none, and GitHub
      # cannot hold an empty secret. Which certificate it is — the
      # maintainer's individual one for now, Koru Works, Inc.'s after the
      # account's conversion (N20) — is the vault's to say, not this file's.
      - name: Decide whether this build is signed
        id: signing
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          API_KEY: ${{ secrets.APPSTORE_API_KEY_P8 }}
          IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ vars.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          have=0
          for value in "$P12" "$API_KEY" "$API_KEY_ID" "$API_ISSUER"; do
            [ -n "$value" ] && have=$((have + 1))
          done
          if [ "$have" -eq 0 ]; then
            echo "No Developer ID material: an unsigned build, not published (rev2 §6)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$have" -ne 4 ] || [ -z "$IDENTITY" ]; then
            echo "::error::The macOS signing material is incomplete: MACOS_CERTIFICATE_P12, APPSTORE_API_KEY_P8, MACOS_SIGNING_IDENTITY, APPSTORE_API_KEY_ID and APPSTORE_API_ISSUER_ID go together (MACOS_CERTIFICATE_PASSWORD too, unless the .p12 has none)"
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
      # The setup is the other jobs': patched crates, the pinned sherpa-onnx
      # archive the voice runtime links, the bundled fonts. Xcode's swiftc,
      # codesign and hdiutil are on the image.
      - name: Fetch third-party code
        run: bash scripts/setup/fetch-third-party.sh
      # mozilla-actions/sccache-action v0.0.11
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      # actions/cache v6.1.0
      - id: sherpa
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: third-party/sherpa-onnx/1.13.6
          key: sherpa-no-tts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup/fetch-voice-runtime.sh') }}
      - name: Fetch the sherpa-onnx archive
        run: bash scripts/setup/fetch-voice-runtime.sh
      # actions/cache v6.1.0
      - id: fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: assets/fonts/
          key: fonts-${{ hashFiles('scripts/setup/fonts.manifest', 'scripts/setup/fetch-fonts.sh') }}
      - name: Fetch fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        run: bash scripts/setup/fetch-fonts.sh
      # (see build-linux)
      - name: Select this nightly's notes
        id: notes
        if: steps.signing.outputs.signed == 'true'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          path="$(./koru.sh release-tool nightly-notes --select "$BEFORE" "$AFTER" | tail -n 1)"
          test -f "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      # **A keychain of the job's own**, made from the `.p12` and deleted at
      # the end, and notarytool with the App Store Connect team key
      # `koru-ci-notary` rather than an Apple ID's app-specific password.
      # koru-release signs through KORU_MAC_SIGN_COMMAND (mac-sign.sh, which
      # passes the entitlements on) and notarizes through
      # KORU_MAC_NOTARIZE_COMMAND, then staples; a staple that fails fails the
      # build.
      - name: Prepare Developer ID signing
        if: steps.signing.outputs.signed == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPSTORE_API_KEY_P8 }}
          IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ vars.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          material="$RUNNER_TEMP/macos-signing"
          (umask 077 && mkdir -p "$material")
          keychain="$material/koru-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          (umask 077 && printf '%s' "$P12" | base64 --decode > "$material/certificate.p12")
          security import "$material/certificate.p12" -k "$keychain" -f pkcs12 \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$material/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # Searched with the login keychain, so codesign finds the chain.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$keychain" | grep -qF "\"$IDENTITY\""; then
            echo "::error::The .p12 does not hold a valid identity named $IDENTITY"
            exit 1
          fi
          (umask 077 && printf '%s\n' "$API_KEY" > "$material/notary.p8")
          {
            echo "KORU_SIGNING_KEYCHAIN=$keychain"
            echo "MACOS_SIGNING_IDENTITY=$IDENTITY"
            echo "KORU_MAC_SIGN_COMMAND=bash \"$GITHUB_WORKSPACE/scripts/release/mac-sign.sh\" {file} {entitlements}"
            echo "KORU_MAC_NOTARIZE_COMMAND=xcrun notarytool submit {file} --key \"$material/notary.p8\" --key-id $API_KEY_ID --issuer $API_ISSUER --wait --timeout 1h"
          } >> "$GITHUB_ENV"
      - name: Build, sign, notarize and write the release files
        if: steps.signing.outputs.signed == 'true'
        env:
          NIGHTLY_MINISIGN_KEY: ${{ secrets.NIGHTLY_MINISIGN_KEY }}
          NIGHTLY_MINISIGN_PASSWORD: ${{ secrets.NIGHTLY_MINISIGN_PASSWORD }}
          NOTES: ${{ steps.notes.outputs.path }}
          BUILD: ${{ needs.plan.outputs.build }}
        run: |
          key="$RUNNER_TEMP/minisign.key"
          (umask 077 && printf '%s\n' "$NIGHTLY_MINISIGN_KEY" > "$key")
          printf '%s' "$NIGHTLY_MINISIGN_PASSWORD" | ./koru.sh release-tool dist-github nightly \
            --build "$BUILD" \
            --notes "$NOTES" \
            --key "$key" --key-password-stdin \
            --download-base "https://github.com/${{ github.repository }}/releases/download/nightly" \
            --out dist/nightly
          rm -f "$key"
      # Unsigned: `dist-local`, the build a Mac developer makes — ad hoc
      # signed, not notarized, no update signature, version
      # `0.0.0-local.<commit>`. It opens through System Settings → Privacy &
      # Security → Open Anyway and never updates itself; it shows that the
      # tree builds, bundles and packs on macOS.
      - name: Build the unsigned disk image
        if: steps.signing.outputs.signed != 'true'
        env:
          BUILD: ${{ needs.plan.outputs.build }}
        run: |
          ./koru.sh release-tool dist-local nightly --build "$BUILD"
          mkdir -p dist/unpublished
          mv dist/cloud/koru-*-macos-aarch64.dmg dist/unpublished/
      # Mounted read-only, as a person's double-click mounts it: the app is
      # sealed, both binaries answer `--help`, and — signed — Gatekeeper
      # accepts the app and the image as notarized Developer ID, with the
      # ticket stapled in.
      - name: Smoke-test the disk image
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ "$SIGNED" = true ]; then images=(dist/nightly/*.dmg); else images=(dist/unpublished/*.dmg); fi
          test "${#images[@]}" -eq 1
          mount="$RUNNER_TEMP/koru-dmg"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "${images[0]}"
          trap 'hdiutil detach "$mount" -force >/dev/null' EXIT
          app="$mount/Koru.app"
          test -L "$mount/Applications"
          codesign --verify --deep --strict --verbose=2 "$app"
          # macOS has no `timeout`; perl's alarm is the same 30 seconds.
          for name in koru koru-agent; do
            perl -e 'alarm 30; exec @ARGV' "$app/Contents/MacOS/$name" --help >/dev/null
          done
          if [ "$SIGNED" = true ]; then
            codesign --display --verbose=2 "$app" 2>&1 | grep -F "Authority=$MACOS_SIGNING_IDENTITY"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type open --context context:primary-signature --verbose=2 "${images[0]}"
          fi
      - name: Delete the signing keychain
        if: always() && steps.signing.outputs.signed == 'true'
        run: |
          if [ -n "${KORU_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$KORU_SIGNING_KEYCHAIN" || true
          fi
          rm -rf "$RUNNER_TEMP/macos-signing"
      # actions/attest-build-provenance v4.2.2
      - if: steps.signing.outputs.signed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/nightly/*.dmg
      # actions/upload-artifact v7.0.2
      - if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nightly-macos-aarch64
          path: dist/nightly/
          retention-days: 7
          if-no-files-found: error
      # actions/upload-artifact v7.0.2
      - if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unpublished-macos-aarch64
          path: dist/unpublished/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish
    needs: [build-linux, build-windows, build-macos]
    # Whatever built is published (rev2 §3); only a nightly where nothing
    # built, or one that was cancelled, publishes nothing. An unsigned macOS
    # build is not a published platform: it neither counts here nor is said
    # to have failed on the page.
    if: >-
      !cancelled() &&
      (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' ||
       (needs.build-macos.result == 'success' && needs.build-macos.outputs.signed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULTS: >-
        linux-x86_64=${{ needs.build-linux.result }}
        windows-x86_64=${{ needs.build-windows.result }}
        ${{ needs.build-macos.outputs.signed == 'true' && format('macos-aarch64={0}', needs.build-macos.result) || '' }}
    steps:
      # One directory per platform that built, named after its artifact.
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: nightly-*
          path: nightly
      # **The order is the point.** Upload every new package first, then point
      # the feeds at them, then delete the packages they replaced — so the
      # manifest an installed app reads never names a file that is not there.
      # Only a platform that built has anything deleted; another platform's
      # files stay as its last nightly left them.
      - name: Replace the built platforms' files
        working-directory: nightly
        run: |
          set -euo pipefail
          shopt -s nullglob
          builds=(*/)
          test "${#builds[@]}" -ge 1
          # Every build writes the same body; a platform that did not build
          # this time is said so below it.
          cp "${builds[0]}release-body.md" release-body.md
          for result in $RESULTS; do
            if [ "${result#*=}" != success ]; then
              printf '\n_The %s build of this nightly did not complete; its download and update feed are from an earlier nightly, if there is one._\n' \
                "${result%%=*}" >> release-body.md
            fi
          done
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --verify-tag --prerelease \
              --title "Koru nightly" --notes-file release-body.md
          fi
          old="$(gh release view nightly --json assets --jq '.assets[].name')"
          packages=() feeds=() targets=()
          for build in "${builds[@]}"; do
            feed=("$build"nightly-*.json)
            test "${#feed[@]}" -eq 1
            feeds+=("${feed[0]}")
            name="$(basename "${feed[0]}" .json)"
            targets+=("${name#nightly-}")
            for file in "$build"*; do
              case "$(basename "$file")" in
                nightly-*.json | release-body.md) ;;
                *) packages+=("$file") ;;
              esac
            done
          done
          gh release upload nightly "${packages[@]}" --clobber
          gh release upload nightly "${feeds[@]}" --clobber
          keep=" "
          for file in "${packages[@]}" "${feeds[@]}"; do keep+="$(basename "$file") "; done
          for name in $old; do
            case "$keep" in *" $name "*) continue ;; esac
            for target in "${targets[@]}"; do
              case "$name" in
                koru-*-"$target".* | koru-*-"$target"-setup.*) gh release delete-asset nightly "$name" --yes ;;
              esac
            done
          done
          gh release edit nightly --prerelease --title "Koru nightly" --notes-file release-body.md
