[package]
rust-version.workspace = true
name = "koru-account-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Provider- and transport-neutral Koru account domain."

[features]
default = []
schema = ["dep:schemars", "koru-store-core/schema"]

# Keep hosted transports, providers, databases, and credential stores outside
# this crate. Adapters implement the ports declared here.
[dependencies]
koru-device = { path = "../koru-device" }
koru-store-core = { path = "../koru-store-core" }
# Only for the version vectors the hosted root-catalog admission answers
# (`root_catalog::admission`); every document it reads is built and
# validated by koru-store-core, which already links the same loro.
loro.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
unicode-normalization.workspace = true
sha2.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
pollster.workspace = true
serde_json.workspace = true
