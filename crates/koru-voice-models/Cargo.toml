[package]
rust-version.workspace = true
name = "koru-voice-models"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Which speech models exist, where their verified bytes are on this machine, and how they get there — the typed projection of koru-models for speech: EngineId, ModelTier and VoiceLanguage over the generic descriptor's tokens, voice's catalog address, voice's cache root and voice's consent record. It knows no engine, no inference runtime, no microphone and no audio: it hands out a directory and a descriptor, and something else loads them."

# **The dependencies are the charter, stated twice.**
#
# `koru-models` is the mechanism: the descriptor and its canonical bytes, the
# catalog document, the trust root, the resumable download and the disk store.
# It was extracted from this crate so a model that is not a speech model can be
# installed by the same code, and everything that needed `reqwest`, `fs2`,
# `minisign-verify` and `koru-update` went with it.
#
# `koru-voice` supplies the identities this crate must not re-declare —
# `ModelId`, `EngineId`, `VoiceLanguage`, and the session error vocabulary a
# model failure has to arrive in. What is left here is the map between those
# and the generic descriptor's tokens.
#
# `url` is what a mirror is. `serde_json` reads voice's typed catalog.
# `koru-env` is where `KORU_VOICE_MODELS` and `KORU_VOICE_CATALOG` are
# declared; a name read without a row there is invisible to `koru.bat envs` and
# to `reference/ENV.md`. They are read here, not in `koru-models`, because they
# are voice's.
#
# **Not here, and not by accident:** no inference runtime, no `cpal`, no
# `koru-ipc`, no `koru-channel`. The model cache is channel-independent
# (ADR-250). See `docs/features/voice/archive/QUESTIONS.md` Q-V26.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
koru-env = { path = "../koru-env" }
koru-voice = { path = "../koru-voice" }
koru-models = { path = "../koru-models" }
# **The gate, not the record.** `ModelStore::install` asks for a
# `koru_voice_consent::Granted` by value, so *no path reaches a download
# without consent* is a signature rather than a rule at every call site. The
# dependency is one way round on purpose: this crate reads a token that crate
# mints, and that crate has never heard of a model cache — installed state is
# derived here, from the disk, and is never copied into a flag beside consent.
koru-voice-consent = { path = "../koru-voice-consent" }

[dev-dependencies]
# The signing half. `minisign` generates a keypair and signs bytes so every
# verification vector — a good signature, a signature over the wrong
# descriptor, a signature from a key nobody pinned — is built rather than
# checked in, which is what keeps them true when the canonical form changes.
minisign = { workspace = true }
tempfile = { workspace = true }
# The *writing* half of the archive format `koru_update::extract_zip` reads.
# A fixture archive is built in the test rather than checked in, for the same
# reason the signatures are: a checked-in zip goes stale silently and the repair
# is the step somebody skips by relaxing the assertion.
zip = { workspace = true }
