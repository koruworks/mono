[package]
rust-version.workspace = true
name = "koru-ai-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Reusable standalone and embedded Koru AI chat surface."

[features]
default = []
# **Never dial anything, never open a browser.** For a host's tests: the Chats
# pane has a reader, the chip composer starts an entity search and hosts the
# document editor, and no `cfg(test)` guard reaches a crate above them, so
# this turns theirs on too.
no-client = [
    "koru-chats-ui/no-reader",
    "koru-search-ui/no-reader",
    "koru-editor/no-browser",
]

[dependencies]
koru-ai-core = { path = "../koru-ai-core" }
koru-ai-wire = { path = "../koru-ai-wire" }
# The Chats surface, hosted here as the standalone window's floating pane
# (AGENTUX I5). It names no host, so this is not a cycle.
koru-chats-ui = { path = "../koru-chats-ui" }
koru-api-client = { path = "../koru-api-client" }
koru-clipboard = { path = "../koru-clipboard" }
koru-channel = { path = "../koru-channel" }
koru-link = { path = "../koru-link" }
koru-i18n = { path = "../koru-i18n" }
koru-env = { path = "../koru-env" }
koru-draw = { path = "../koru-draw" }
koru-markdown = { path = "../koru-markdown" }
koru-keys = { path = "../koru-keys" }
koru-ui = { path = "../koru-ui" }
koru-window = { path = "../koru-window" }
# **The chip composer** (AGENTUX I6, X1): the composer is a Koru document in a
# private in-memory workspace, edited by the same editor as every page, so a
# document can sit in the text as a chip. The accepted cost, stated in the
# plan: this crate and `koru-ai-chat.exe` link the editor and the workspace
# stack. The search behind `@` is the shared entity search; the message goes
# out through the Markdown exporter so a chip has one spelling everywhere.
koru-core = { path = "../koru-core" }
koru-editor = { path = "../koru-editor" }
koru-search-ui = { path = "../koru-search-ui" }
koru-export-markdown = { path = "../koru-export-markdown" }
parley.workspace = true
bytes.workspace = true
image = "0.25"
reqwest.workspace = true
serde_json.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
uuid.workspace = true

[dev-dependencies]
# `cfg(test)` here cannot reach these crates' own guards — a dependency is
# never compiled with it — so the suite turns them on by feature.
koru-search-ui = { path = "../koru-search-ui", features = ["no-reader"] }
koru-editor = { path = "../koru-editor", features = ["no-browser"] }
