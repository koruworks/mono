# SPDX-License-Identifier: MPL-2.0
#
# The conversion's Python environment, every package pinned by version AND by
# SHA-256. `koru-release read-model convert` installs it with
# `pip install --require-hashes --no-deps`, so nothing outside this file is
# ever installed, and a re-uploaded wheel is a hash failure rather than a
# silent change. It is the only copy of the conversion's tool pins; the model
# files' pins are in `crates/koru-release/src/read_model/table.rs`.
#
# Python 3.12 on Windows x64. paddle2onnx 2.1.0 publishes no wheel for 3.13,
# and the paddlepaddle wheel below exists only for Windows x64 (see why), which
# is why the convert verb refuses to run anywhere else.
#
# **Why paddlepaddle is a nightly, and this old one.** paddle2onnx 2.1.0's
# Windows extension module imports about 110 `pir::` symbols from
# paddle's `libpaddle.pyd`. Every release from 3.2.0 to 3.3.1, and the
# 3.4.0.dev20260112 nightly, does not export them, and the import fails with
# "DLL load failed ... The specified procedure could not be found". The
# 3.0.0.dev20250426 nightly, published by PaddlePaddle on its own wheel host,
# exports them, and loads and converts the PP-OCRv6 files. It needs `astor`
# and `decorator` (its declared requirements), and `setuptools` at import time,
# which a Python 3.12 venv no longer contains.
#
# onnxruntime, sympy, onnx_graphsurgeon and ml_dtypes are here because
# paddle2onnx's constant folding (polygraphy) imports them and, if one is
# missing, pip-installs whatever is newest at that moment — onnx_graphsurgeon
# from NVIDIA's own index as well as PyPI. **Setting
# POLYGRAPHY_AUTOINSTALL_DEPS=0 does not stop it**: paddle2onnx 2.1.0 sets that
# variable to 1 inside its own process just before it folds
# (paddle2onnx/convert.py, `optimize_tool == "polygraphy"`). Plan 0.1 pinned the
# first two and relied on the variable for the rest, so its runs, and Plan
# 2.2's first two, installed onnx_graphsurgeon 0.6.1 and ml_dtypes 0.6.0
# unpinned. They are pinned here at exactly those versions, so polygraphy finds
# them and installs nothing, and the convert verb runs the conversion with
# PIP_NO_INDEX=1 so any future install attempt fails instead of drifting (a
# failed fold changes the output, and the table's digests then refuse it).
#
# Generated from `pip freeze --all` of a venv in which the pins resolved, with
# every distribution file PyPI publishes for each pinned version hashed. The
# paddlepaddle hash is the one PaddlePaddle's wheel host serves in its index.

