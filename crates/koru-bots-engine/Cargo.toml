[package]
name = "koru-bots-engine"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The Bots engine worker, its durable ledger and local control interface."

[features]
default = []
schema = ["dep:schemars", "koru-delegate-core/schema", "koru-ai-core/schema", "koru-recurrence/schema"]
# Only the Bot worker owns provider processes. Gateway consumers use the
# engine's contracts without acquiring the session runtime's composition.
provider-runtime = ["dep:koru-session-runtime", "dep:koru-session-profiles", "dep:axum", "dep:tokio", "dep:rmcp"]

[dependencies]
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rmcp = { version = "=3.9.0", default-features = false, features = ["server"], optional = true }
blake3.workspace = true
koru-agent-worker = { path = "../koru-agent-worker" }
# Shared composer metadata and validation, never the legacy AI repository.
koru-ai-core = { path = "../koru-ai-core" }
koru-channel = { path = "../koru-channel" }
koru-delegate-core = { path = "../koru-delegate-core" }
koru-delegate-preamble = { path = "../koru-delegate-preamble" }
koru-i18n = { path = "../koru-i18n" }
koru-recurrence = { path = "../koru-recurrence" }
koru-time-zone = { path = "../koru-time-zone" }
koru-ipc = { path = "../koru-ipc" }
koru-sqlite = { path = "../koru-sqlite" }
koru-store-core = { path = "../koru-store-core" }
koru-settings = { path = "../koru-settings" }
koru-session-protocol = { path = "../koru-session-protocol" }
koru-session-profiles = { path = "../koru-session-profiles", optional = true }
koru-session-runtime = { path = "../koru-session-runtime", optional = true }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }
sha2.workspace = true
uuid.workspace = true

[dev-dependencies]
koru-session-runtime = { path = "../koru-session-runtime" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_SystemInformation"] }

[[test]]
name = "engine_process"
harness = false

[[test]]
name = "bot_process"
harness = false

[[test]]
name = "session_process"
harness = false
required-features = ["provider-runtime"]

