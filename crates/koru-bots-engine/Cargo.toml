[package]
name = "koru-bots-engine"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The Bots engine worker, its durable ledger and local control interface."

[features]
default = []
active = ["provider-runtime"]
# Only the Bot worker owns provider processes. Legacy consumers need the mode
# and ownership fence without acquiring the session runtime's composition.
provider-runtime = ["dep:koru-session-runtime", "dep:axum", "dep:tokio", "dep:rmcp"]

[dependencies]
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rmcp = { version = "=3.9.0", default-features = false, features = ["server"], optional = true }
blake3.workspace = true
koru-agent-worker = { path = "../koru-agent-worker" }
koru-bot-client-wire = { path = "../koru-bot-client-wire" }
koru-channel = { path = "../koru-channel" }
koru-ipc = { path = "../koru-ipc" }
koru-sqlite = { path = "../koru-sqlite" }
koru-settings = { path = "../koru-settings" }
koru-session-protocol = { path = "../koru-session-protocol" }
koru-session-runtime = { path = "../koru-session-runtime", optional = true }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true

[dev-dependencies]
koru-session-runtime = { path = "../koru-session-runtime" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_SystemInformation"] }

[[test]]
name = "engine_process"
harness = false

[[test]]
name = "bot_process"
harness = false

[[test]]
name = "session_process"
harness = false
required-features = ["provider-runtime"]

