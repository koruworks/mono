[package]
rust-version.workspace = true
name = "koru-agent-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Running a role of our own executable, or a sibling program, as a supervised child."

[dependencies]
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
# `Win32_System_IO`: the completion port a memory-limited job reports its
# limit on (`windows_job.rs`).
windows-sys = { workspace = true, features = ["Win32_System_IO"] }

# `kill(-pgid, …)` and `getpgrp`: the process group is the unix stand-in for
# the Job Object (M24).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
koru-session-runtime = { path = "../koru-session-runtime" }
serde_json.workspace = true

[[test]]
name = "worker_process"
harness = false

[[test]]
name = "bots_containment"
harness = false
