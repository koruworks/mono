[package]
rust-version.workspace = true
name = "koru-session-profiles"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Shared raw terminal-session launch profiles and executable presence probes."

[dependencies]
koru-session-protocol = { path = "../koru-session-protocol" }

# The registry binding the search path reads the current user and machine
# `Path` through (`search_path.rs`): a long-lived process's inherited `PATH`
# misses anything installed after it started.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }
